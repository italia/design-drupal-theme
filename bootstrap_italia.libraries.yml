# Bootstrap Italia v3 – Libraries
#
# Struttura B2:
#  - global.base   → CSS globale compilato da Vite (token, reset, typography, grid)
#  - global.fonts  → font loader JS (upstream fonts-loader.js con path da drupalSettings)
#  - component CSS/JS dichiarato direttamente in NAME.component.yml (percorsi relativi)

global.base:
  version: VERSION
  css:
    theme:
      dist/css/base.css: {}
  dependencies:
    - core/drupal

global.fonts:
  version: VERSION
  js:
    dist/js/fonts.js: { type: external, minified: true }
  dependencies:
    - core/drupal
    - bootstrap_italia/global.base
