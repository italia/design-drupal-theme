$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Icon
status: experimental
description: 'SVG icon from the Bootstrap Italia sprite. Mirrors upstream <svg class="icon"><use></use></svg> pattern.'
props:
  type: object
  properties:
    name:
      type: string
      title: 'Icon name'
      description: 'Icon identifier without the "it-" prefix (e.g. "user", "arrow-right").'
    size:
      type: string
      title: 'Size'
      description: 'Adds class icon-{size}. Allowed: xs, sm, lg, xl.'
      enum: ['xs', 'sm', 'lg', 'xl']
    color:
      type: string
      title: 'Color'
      description: 'Adds class icon-{color}.'
      enum: ['primary', 'secondary', 'success', 'warning', 'danger', 'inverse', 'disabled', 'white']
    padded:
      type: boolean
      title: 'Padded'
      description: 'Adds icon-padded class (extra margin).'
    rounded:
      type: boolean
      title: 'Rounded container'
      description: 'Wraps the icon in a rounded-icon container.'
    label:
      type: string
      title: 'Accessible label'
      description: 'aria-label for the SVG. Defaults to the icon name.'
  required:
    - name
stylesheets:
  - icon.css
