props:
  type: object
  properties:
    variant:
      type: string
      title: 'Variant'
      description: 'Optional SDC variant used as a convenience layer to derive `color` and `size` defaults.'
    name:
      type: string
      title: 'Icon name'
      description: 'Sprite icon ID, for example `it-arrow-right`.'
    label:
      type: string
      title: 'Accessible label'
      description: 'Accessible text for non-decorative icons. If omitted, the component falls back to the icon name.'
    align:
      type: string
      title: 'Vertical alignment'
      description: 'Optional vertical alignment modifier: `bottom`, `middle`, or `top`.'
      enum:
        - ''
        - bottom
        - middle
        - top
    padded:
      type: boolean
      title: 'Padded icon'
      description: 'Adds the `icon-padded` utility class.'
    size:
      type: string
      title: 'Size'
      description: 'Optional size modifier: `xs`, `sm`, `lg`, or `xl`.'
      enum:
        - xs
        - sm
        - ''
        - lg
        - xl
    color:
      type: string
      title: 'Color'
      description: 'Optional color modifier such as `primary`, `secondary`, `success`, `warning`, `danger`, `light`, `white`, `disabled`, or `inverse`.'
      enum:
        - ''
        - primary
        - secondary
        - success
        - warning
        - danger
        - light
        - white
        - disabled
        - inverse
    src:
      type: string
      title: 'Sprite path'
      description: 'Path to the SVG sprite file. Defaults to the Bootstrap Italia sprite shipped with the theme.'
    decorative:
      type: boolean
      title: 'Decorative icon'
      description: 'When `true`, the icon is hidden from assistive technologies.'
    wrapper_attributes:
      type: Drupal\Core\Template\Attribute
      title: 'SVG attributes'
      description: 'Drupal Attribute object applied to the outer `<svg>` element.'
    attributes:
      type: Drupal\Core\Template\Attribute
      title: 'Use attributes'
      description: 'Drupal Attribute object applied to the inner `<use>` element.'
  required:
    - name
