$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Button
status: experimental
description: >
  Interactive button. The base .btn class is always injected automatically.
  Renders <a> when url is provided, <button> otherwise.
  Caller controls color/variant/size via attributes.
props:
  type: object
  properties:
    label:
      type: string
      title: 'Label'
    url:
      type: string
      title: 'URL'
      description: 'If set, renders <a href>. Omit for <button>.'
    type:
      type: string
      title: 'Button type'
      description: 'HTML type for <button>. Ignored when url is set.'
      enum: ['button', 'submit', 'reset']
    disabled:
      type: boolean
      title: 'Disabled'
      description: 'disabled on <button>, aria-disabled + .disabled on <a>.'
    icon_name:
      type: string
      title: 'Icon name'
      description: 'Bootstrap Italia icon name. Adds .btn-icon modifier automatically.'
    attributes:
      type: object
      title: 'HTML Attributes'
      description: >
        Drupal Attribute object. Color: btn-primary | btn-secondary | btn-success |
        btn-warning | btn-danger. Outline: btn-outline-* variants. Size: btn-xs | btn-lg.
        Modifiers: btn-full | btn-link. Toggle: data-bs-toggle="button".
        Base .btn class always added automatically.
  required:
    - label
stylesheets:
  - button.css
scripts:
  - button.js
