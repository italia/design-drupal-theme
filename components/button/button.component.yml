  link__outline__sm:
    title: 'Link outline small'
    description: 'Preconfigures link color, outline mode, and sm size.'
  primary__outline__lg:
    title: 'Primary outline large'
    description: 'Preconfigures primary color, outline mode, and lg size.'
  secondary__outline__lg:
    title: 'Secondary outline large'
    description: 'Preconfigures secondary color, outline mode, and lg size.'
  success__outline__lg:
    title: 'Success outline large'
    description: 'Preconfigures success color, outline mode, and lg size.'
  warning__outline__lg:
    title: 'Warning outline large'
    description: 'Preconfigures warning color, outline mode, and lg size.'
  danger__outline__lg:
    title: 'Danger outline large'
