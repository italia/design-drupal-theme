    description: 'Preconfigures warning color, outline mode, and xs size.'
  danger__outline__xs:
    title: 'Danger outline extra small'
    description: 'Preconfigures danger color, outline mode, and xs size.'
  link__outline__xs:
    title: 'Link outline extra small'
    description: 'Preconfigures link color, outline mode, and xs size.'
  primary__outline__sm:
    title: 'Primary outline small'
    description: 'Preconfigures primary color, outline mode, and sm size.'
  secondary__outline__sm:
    title: 'Secondary outline small'
    description: 'Preconfigures secondary color, outline mode, and sm size.'
  success__outline__sm:
    title: 'Success outline small'
    description: 'Preconfigures success color, outline mode, and sm size.'
  warning__outline__sm:
    title: 'Warning outline small'
    description: 'Preconfigures warning color, outline mode, and sm size.'
  danger__outline__sm:
    title: 'Danger outline small'
