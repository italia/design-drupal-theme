props:
  type: object
  properties:
    type:
      type: string
      title: 'Type'
      description: 'Button type used for the `<button>` variant.'
      enum:
        - button
        - submit
        - reset
    label:
      type: string
      title: 'Label'
      description: 'Visible button text.'
    url:
      type: string
      title: 'URL'
      description: 'Optional navigation target. When provided, the component renders as `<a>`.'
    size:
      type: string
      title: 'Size'
      description: 'Optional size modifier appended as `.btn-{size}`.'
      enum:
        - ''
        - xs
        - sm
        - lg
    color:
      type: string
      title: 'Color'
      description: 'Color variant appended as `.btn-{color}` or `.btn-outline-{color}`.'
      enum:
        - primary
        - secondary
        - success
        - warning
        - danger
        - link
    outline:
      type: boolean
      title: 'Outline'
      description: 'When `true`, uses the outline variant for the selected color.'
    disabled:
      type: boolean
      title: 'Disabled'
      description: 'Disables the button. On links, sets `aria-disabled="true"` and adds the `disabled` class.'
    icon:
      type: object
      title: 'Icon'
      description: 'Context passed through to the `bootstrap_italia:icon` component.'
      properties:
        name:
          type: string
          title: 'Icon name'
          description: 'Sprite icon ID, for example `it-arrow-right`.'
        label:
          type: string
          title: 'Accessible label'
          description: 'Accessible text for non-decorative icons. If omitted, the icon component falls back to the icon name.'
        align:
          type: string
          title: 'Vertical alignment'
          description: 'Optional vertical alignment modifier forwarded to the icon component.'
          enum:
            - ''
            - bottom
            - middle
            - top
        padded:
          type: boolean
          title: 'Padded icon'
          description: 'Adds the `icon-padded` utility class on the nested icon.'
        size:
          type: string
          title: 'Icon size'
          description: 'Optional icon size modifier.'
          enum:
            - xs
            - sm
            - ''
            - lg
            - xl
        color:
          type: string
          title: 'Icon color'
          description: 'Optional icon color modifier. The button template may override this to preserve variant contrast.'
          enum:
            - ''
            - primary
            - secondary
            - success
            - warning
            - danger
            - light
            - white
            - disabled
            - inverse
        src:
          type: string
          title: 'Sprite path'
          description: 'Optional custom SVG sprite path.'
        decorative:
          type: boolean
          title: 'Decorative icon'
          description: 'When `true`, the nested icon is hidden from assistive technologies.'
      required:
        - name
    icon_position:
      type: string
      title: 'Icon position'
      description: 'Controls whether the icon is rendered before or after the label.'
      enum:
        - before
        - after
    attributes:
      type: Drupal\Core\Template\Attribute
      title: 'HTML Attributes'
      description: 'Drupal Attribute object applied to the root element. The base `.btn` class is always added automatically.'
  required:
    - label
