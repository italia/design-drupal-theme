  link__xs:
    title: 'Link extra small'
    description: 'Preconfigures the button color as link and the size as xs.'
  primary__sm:
    title: 'Primary small'
    description: 'Preconfigures the button color as primary and the size as sm.'
  secondary__sm:
    title: 'Secondary small'
    description: 'Preconfigures the button color as secondary and the size as sm.'
  success__sm:
    title: 'Success small'
    description: 'Preconfigures the button color as success and the size as sm.'
  warning__sm:
    title: 'Warning small'
    description: 'Preconfigures the button color as warning and the size as sm.'
  danger__sm:
    title: 'Danger small'
    description: 'Preconfigures the button color as danger and the size as sm.'
  link__sm:
    title: 'Link small'
    description: 'Preconfigures the button color as link and the size as sm.'
  primary__lg:
    title: 'Primary large'
    description: 'Preconfigures the button color as primary and the size as lg.'
  secondary__lg:
    title: 'Secondary large'
    description: 'Preconfigures the button color as secondary and the size as lg.'
  success__lg:
    title: 'Success large'
    description: 'Preconfigures the button color as success and the size as lg.'
  warning__lg:
    title: 'Warning large'
    description: 'Preconfigures the button color as warning and the size as lg.'
  danger__lg:
    title: 'Danger large'
    description: 'Preconfigures the button color as danger and the size as lg.'
  link__lg:
    title: 'Link large'
    description: 'Preconfigures the button color as link and the size as lg.'
  primary__outline:
    title: 'Primary outline'
    description: 'Preconfigures the button color as primary and enables outline mode.'
  secondary__outline:
    title: 'Secondary outline'
    description: 'Preconfigures the button color as secondary and enables outline mode.'
  success__outline:
    title: 'Success outline'
    description: 'Preconfigures the button color as success and enables outline mode.'
  warning__outline:
    title: 'Warning outline'
    description: 'Preconfigures the button color as warning and enables outline mode.'
  danger__outline:
    title: 'Danger outline'
    description: 'Preconfigures the button color as danger and enables outline mode.'
  link__outline:
    title: 'Link outline'
    description: 'Preconfigures the button color as link and enables outline mode.'
  primary__outline__xs:
    title: 'Primary outline extra small'
    description: 'Preconfigures primary color, outline mode, and xs size.'
  secondary__outline__xs:
    title: 'Secondary outline extra small'
    description: 'Preconfigures secondary color, outline mode, and xs size.'
  success__outline__xs:
    title: 'Success outline extra small'
    description: 'Preconfigures success color, outline mode, and xs size.'
  warning__outline__xs:
