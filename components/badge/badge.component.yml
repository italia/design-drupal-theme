$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Badge
status: experimental
description: 'Inline badge label with optional link behavior. The base `.badge` class is always injected automatically.'
props:
  type: object
  properties:
    label:
      type: string
      title: 'Label'
      description: 'Short badge text, such as a count, status, or compact keyword.'
    color:
      type: string
      title: 'Color'
      description: 'Optional color modifier.'
      enum:
        - primary
        - secondary
        - success
        - warning
        - danger
        - disabled
        - inverse
        - light
        - white
    small:
      type: boolean
      title: 'Small'
      description: 'Adds the compact `badge-sm` modifier.'
    rounded:
      type: boolean
      title: 'Rounded'
      description: 'Adds the `rounded-pill` modifier.'
    url:
      type: string
      title: 'URL'
      description: 'Optional link destination. When provided, the badge is rendered through the link component.'
    attributes:
      type: Drupal\Core\Template\Attribute
      title: 'HTML Attributes'
      description: 'Drupal Attribute object applied to the rendered badge element. The base `.badge` class is always added automatically.'
  required:
    - label
