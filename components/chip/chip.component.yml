$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Chip
status: experimental
description: 'Compact interactive element for tags, filters, or selections. Mirrors upstream .chip pattern.'
props:
  type: object
  properties:
    label:
      type: string
      title: 'Label'
      description: 'Chip text content.'
    href:
      type: string
      title: 'Link URL'
      description: 'Makes the chip label a link.'
    color:
      type: string
      title: 'Color'
      description: 'Adds class chip-{color}.'
      enum: ['primary', 'secondary', 'success', 'warning', 'danger']
    size:
      type: string
      title: 'Size'
      description: 'Adds class chip-{size}. Currently only "lg" is supported.'
      enum: ['lg']
    disabled:
      type: boolean
      title: 'Disabled'
      description: 'Adds chip-disabled class.'
    closable:
      type: boolean
      title: 'Closable'
      description: 'Shows a close (×) button inside the chip.'
    close_label:
      type: string
      title: 'Close button label'
      description: 'Accessible label for the close button. Defaults to "Rimuovi".'
    icon:
      type: object
      title: 'Icon'
      description: 'Nested icon component props.'
      properties:
        name:
          type: string
        size:
          type: string
    avatar:
      type: object
      title: 'Avatar'
      description: 'Nested avatar component props.'
  required:
    - label
stylesheets:
  - chip.css
