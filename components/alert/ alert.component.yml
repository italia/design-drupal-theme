$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Alert
status: experimental
description: 'Contextual alert box. Thin wrapper — the caller controls variant and classes (alert, alert-success, etc.) via the attributes prop. role="alert" is always injected.'
props:
  type: object
  properties:
    dismissible:
      type: boolean
      title: 'Dismissible'
      description: 'Adds a close button with data-bs-dismiss="alert". Automatically injects .alert-dismissible into the wrapper.'
    dismiss_label:
      type: string
      title: 'Dismiss label'
      description: 'aria-label for the close button. Defaults to "Chiudi avviso".'
    attributes:
      type: object
      title: 'HTML Attributes'
      description: 'Drupal Attribute object for the wrapper element. Use to set class: alert, alert-success, alert-warning, alert-danger, alert-primary, alert-secondary. add fade + show for animated dismiss.'
stylesheets:
  - alert.css
scripts:
  - alert.js
